<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAGI | Digital Experience</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Raleway:wght@300;400&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand-green: #4a5d4e; /* Sage green for a bio/natural feel */
            --brand-gold: #c5a059;  /* Subtle gold for premium quality */
            --bg-cream: #fcfbf7;
            --text-main: #2c2c2c;
        }

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background-color: var(--bg-cream);
            font-family: 'Raleway', sans-serif;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* --- THE NEW LOGO --- */
        .logo-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 40px;
        }

        .logo-icon {
            width: 60px;
            height: 60px;
            border: 1.5px solid var(--brand-green);
            border-radius: 50%;
            position: relative;
            margin-bottom: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Stylized leaf symbol using CSS shapes */
        .logo-icon::after {
            content: '';
            width: 25px;
            height: 25px;
            background-color: var(--brand-green);
            border-radius: 100% 0 100% 0; /* Creates leaf shape */
            transform: rotate(-15deg);
        }

        .logo-name {
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            font-weight: 400;
            letter-spacing: 0.15rem;
            color: var(--brand-green);
            margin: 0;
        }

        .logo-tagline {
            font-size: 0.75rem;
            letter-spacing: 0.4rem;
            text-transform: uppercase;
            color: var(--brand-gold);
            margin-top: 5px;
        }
        /* --- END LOGO --- */

        .content {
            text-align: center;
            max-width: 450px;
            padding: 0 20px;
        }

        h1 {
            font-weight: 300;
            font-size: 1.2rem;
            margin-bottom: 20px;
            font-style: italic;
        }

        p {
            font-size: 0.9rem;
            line-height: 1.8;
            color: #555;
            margin-bottom: 30px;
        }

        .contact-link {
            font-size: 0.85rem;
            text-decoration: none;
            color: var(--brand-green);
            border: 1px solid var(--brand-green);
            padding: 10px 25px;
            transition: all 0.3s ease;
        }

        .contact-link:hover {
            background-color: var(--brand-green);
            color: white;
        }

    </style>
</head>
<body>

    <div class="logo-wrap">
        <div class="logo-icon"></div>
        <h2 class="logo-name">MAGI</h2>
        <span class="logo-tagline">BULGARIA</span>
    </div>

    <div class="content">
        <h1>Coming Together</h1>
        <p>
            We are currently developing our online presence to better serve 
            our partners and customers. Thank you for your patience.
        </p>
        
        <a href="mailto:sourcing@magiltd.org" class="contact-link">
            sourcing@magiltd.org
        </a>
    </div>

</body>
</html>
