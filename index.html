<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAGI | Online Presence Under Construction</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Raleway:wght@300;400&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand-green: #3e4e41; /* Deeper forest green for a natural, premium feel */
            --brand-gold: #b39152;  /* Muted metallic tone */
            --bg-cream: #faf9f6;
            --text-main: #2c2c2c;
        }

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background-color: var(--bg-cream);
            font-family: 'Raleway', sans-serif;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* --- THE BOUTIQUE LOGO --- */
        .logo-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 50px;
        }

        .logo-icon {
            width: 50px;
            height: 50px;
            border-top: 1px solid var(--brand-green);
            border-bottom: 1px solid var(--brand-green);
            position: relative;
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Minimalist leaf shape icon */
        .logo-icon::after {
            content: '';
            width: 18px;
            height: 18px;
            background-color: var(--brand-gold);
            border-radius: 80% 0 80% 0;
            transform: rotate(-45deg);
        }

        .logo-name {
            font-family: 'Playfair Display', serif;
            font-size: 3.2rem;
            font-weight: 400;
            letter-spacing: 0.2rem;
            color: var(--brand-green);
            margin: 0;
            line-height: 1;
        }

        .logo-divider {
            width: 120px;
            height: 1px;
            background-color: var(--brand-gold);
            margin-top: 15px;
        }
        /* --- END LOGO --- */

        .content {
            text-align: center;
            max-width: 450px;
            padding: 0 20px;
        }

        h1 {
            font-weight: 300;
            font-size: 1.1rem;
            letter-spacing: 0.1rem;
            margin-bottom: 25px;
            color: var(--brand-green);
        }

        p {
            font-size: 0.95rem;
            line-height: 1.8;
            color: #555;
            margin-bottom: 35px;
        }

        .contact-box {
            border-top: 1px solid #e0e0e0;
            padding-top: 25px;
        }

        .email-label {
            display: block;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.2rem;
            color: #999;
            margin-bottom: 10px;
        }

        .contact-link {
            font-size: 0.9rem;
            text-decoration: none;
            color: var(--text-main);
            font-weight: 400;
            transition: color 0.3s ease;
        }

        .contact-link:hover {
            color: var(--brand-gold);
        }

    </style>
</head>
<body>

    <div class="logo-wrap">
        <div class="logo-icon"></div>
        <h2 class="logo-name">MAGI</h2>
        <div class="logo-divider"></div>
    </div>

    <div class="content">
        <h1>Coming Soon</h1>
        <p>
            Our online home is currently under preparation. We are busy 
            building something special to share with you.
        </p>
        
        <div class="contact-box">
            <span class="email-label">Get in touch</span>
            <a href="mailto:sourcing@magiltd.org" class="contact-link">
                sourcing@magiltd.org
            </a>
        </div>
    </div>

</body>
</html>
