<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAGI | Coming Soon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2d3436;
            --accent-color: #a29bfe;
            --text-muted: #636e72;
            --bg-color: #f9f9f9;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-color);
            color: var(--primary-color);
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .container {
            padding: 2rem;
            max-width: 600px;
        }

        /* Minimalist Logo Construction */
        .logo-container {
            margin-bottom: 3rem;
        }

        .logo-mark {
            font-weight: 700;
            font-size: 3.5rem;
            letter-spacing: 0.5rem;
            text-transform: uppercase;
            border: 4px solid var(--primary-color);
            padding: 10px 20px;
            display: inline-block;
            margin-bottom: 10px;
        }

        .logo-text {
            display: block;
            font-weight: 300;
            letter-spacing: 0.2rem;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        h1 {
            font-weight: 500;
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            color: var(--primary-color);
        }

        p {
            line-height: 1.6;
            color: var(--text-muted);
            margin-bottom: 2rem;
        }

        .divider {
            width: 50px;
            height: 2px;
            background-color: var(--accent-color);
            margin: 2rem auto;
        }

        .contact-email {
            font-weight: 500;
            color: var(--primary-color);
            text-decoration: none;
            border-bottom: 1px solid transparent;
            transition: border-color 0.3s ease;
        }

        .contact-email:hover {
            border-bottom: 1px solid var(--accent-color);
        }

        @media (max-width: 480px) {
            .logo-mark { font-size: 2.5rem; }
            h1 { font-size: 1.2rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Minimalist Logo Section -->
        <div class="logo-container">
            <div class="logo-mark">MAGI</div>
            <span class="logo-text">ESTABLISHED 2026</span>
        </div>

        <div class="divider"></div>

        <h1>Refining our online presence.</h1>
        
        <p>
            We are currently crafting a digital experience that reflects our commitment to quality. 
            Our full website will be launching soon.
        </p>

        <p>
            For inquiries or partnerships, please reach out to:<br>
            <a href="mailto:sourcing@magiltd.org" class="contact-email">sourcing@magiltd.org</a>
        </p>
    </div>

</body>
</html>
